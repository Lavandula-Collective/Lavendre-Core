plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://raw.githubusercontent.com/Let-s-Do-Collection/Foundation/1.21.1/maven" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modRuntimeOnly "maven.modrinth:AANobbMI:u1OEbNKx" // Sodium
    modRuntimeOnly "maven.modrinth:gvQqBUqZ:N08Z8wog" // Lithium
    modRuntimeOnly "maven.modrinth:mOgUt4GM:v6Xx3fbU" // Mod Menu
    modRuntimeOnly "maven.modrinth:HXF82T3G:fhyqphwv" // BOP
    modRuntimeOnly "maven.modrinth:s3dmwKy5:sux8kYHe" // Glitch Core
    modRuntimeOnly "maven.modrinth:kkmrDlKT:XNtIBXyQ" // Terrabender
    modRuntimeOnly "maven.modrinth:HJetCzWo:dBeMI34d" // [Let's Do] Farm & Charm
    modRuntimeOnly "maven.modrinth:7vxePowz:wbVXT4Ua" // Farmer's Delight Refabricated
    modRuntimeOnly "maven.modrinth:paO4gjmE:QhGhYjLN" // [Let's Do] Hearth & Timber
    modRuntimeOnly "maven.modrinth:Eh11TaTm:43g8sVYA" // [Let's Do] HerbalBrews
    modRuntimeOnly "maven.modrinth:foa4fGIH:VAEiChba" // Rustic Delight
    modRuntimeOnly "maven.modrinth:ugCWUHV9:JjBuHb3J" // Enhanced Celestials 2: Core
    modRuntimeOnly "maven.modrinth:ziOp6EO8:srVXMYcH" // CorgiLib
    modRuntimeOnly "maven.modrinth:z2XEADmE:puBUxsNk" // Data Anchor
    modRuntimeOnly "dev.architectury:architectury-fabric:13.0.8" // Architectury
    modRuntimeOnly "maven.modrinth:9s6osm5g:HpMb5wGb" // Cloth Config
    modRuntimeOnly "net.satisfy.foundation:foundation-fabric:1.0.7" // Foundation
    modRuntimeOnly "net.jodah:typetools:0.6.3" // Typetools
    modRuntimeOnly "com.electronwill.night-config:core:3.8.3" // NC: Core
    modRuntimeOnly "com.electronwill.night-config:toml:3.8.3" // NC: TOML

    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

apply from: 'gradle/lavendre-packs.gradle'

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}